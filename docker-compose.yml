services:
  bot:
    build: .
    container_name: repost-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/repost.db
    volumes:
      - ./data:/data
      - ./sources.txt:/app/sources.txt:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
